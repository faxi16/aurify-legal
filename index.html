<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aurify - Legal & Support</title>
    <style>
        :root {
            --primary: #6750A4;
            --background: #0F0F13;
            --surface: #1C1B20;
            --on-surface: #E6E1E5;
            --on-surface-variant: #CAC4D0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--background);
            color: var(--on-surface);
            line-height: 1.6;
            margin: 0;
            padding: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 90vh;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background: var(--surface);
            padding: 36px;
            border-radius: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            text-align: center;
        }
        h1 {
            color: var(--primary);
            font-size: 32px;
            margin-bottom: 8px;
        }
        p {
            color: var(--on-surface-variant);
            margin-bottom: 28px;
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .btn {
            display: block;
            padding: 14px 20px;
            background: var(--primary);
            color: #fff;
            text-decoration: none;
            border-radius: 12px;
            font-weight: bold;
            transition: opacity 0.2s;
        }
        .btn:hover {
            opacity: 0.9;
        }
        .btn-secondary {
            background: rgba(255,255,255,0.08);
            color: var(--on-surface);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Aurify</h1>
        <p>Augmented Reality Memory & Spatial Audio Platform</p>

        <div class="btn-group">
            <a href="privacy_tr.html" class="btn">🇹🇷 Gizlilik Politikası & KVKK (Türkçe)</a>
            <a href="terms_tr.html" class="btn btn-secondary">🇹🇷 Kullanım Koşulları (Türkçe)</a>
            <a href="privacy.html" class="btn" style="margin-top: 10px;">🇬🇧 Privacy Policy (English)</a>
            <a href="terms.html" class="btn btn-secondary">🇬🇧 Terms of Service (English)</a>
        </div>
    </div>
</body>
</html>
